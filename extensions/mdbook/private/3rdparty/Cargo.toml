[package]
name = "rules_rust_mdbook_deps"
version = "0.0.0"
edition = "2021"
publish = false

# No crate is built from this manifest; it only declares dependencies.
[lib]
path = "lib.rs"

[dependencies]
# `mdbook` ships only a binary since 0.5; `cargo metadata` drops such a
# package, and crate_universe puts it back from its source.
mdbook = "=0.5.4"
