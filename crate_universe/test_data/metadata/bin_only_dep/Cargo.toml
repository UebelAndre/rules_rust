[package]
name = "bin-only-dep"
version = "0.1.0"
edition = "2021"

# Required to satisfy cargo but no `lib.rs` is expected to
# exist within test data.
[lib]
path = "lib.rs"

# `shellharden` ships only a binary. `cargo metadata` drops the package with
# a warning; the resolver puts it back from its downloaded source.
[dependencies]
shellharden = "=4.3.2"
